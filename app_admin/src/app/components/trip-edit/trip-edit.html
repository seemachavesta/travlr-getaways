<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">{{ isNew ? 'Add Trip' : 'Edit Trip' }}</h2>
  <a class="btn btn-outline-secondary" routerLink="/trips">Back</a>
  <!-- Or use a button if you prefer:
  <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Back</button>
  -->
</div>

<div *ngIf="loading" class="alert alert-info">Loading…</div>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<form [formGroup]="form" (ngSubmit)="save()" *ngIf="!loading">
  <div class="mb-3">
    <label class="form-label">Code</label>
    <input class="form-control" formControlName="code" placeholder="HAW1">
  </div>

  <div class="mb-3">
    <label class="form-label">Title</label>
    <input class="form-control" formControlName="title" placeholder="Hawaii Beach Escape">
  </div>

  <div class="mb-3">
    <label class="form-label">Duration</label>
    <input class="form-control" formControlName="duration" placeholder="7 nights">
  </div>

  <div class="mb-3">
    <label class="form-label">Price</label>
    <input type="number" class="form-control" formControlName="price" min="0">
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" formControlName="description" rows="4"></textarea>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">
      {{ isNew ? 'Add Trip' : 'Save Changes' }}
    </button>

    <button class="btn btn-danger" type="button" (click)="delete()" *ngIf="!isNew">
      Delete
    </button>
  </div>
</form>
